# Builds PAXwave from this repository's source and attaches the signed APKs
# to a GitHub release.
#
# Use: bump versionCode and versionName in app/build.gradle.kts, commit, then
# Releases -> Draft a new release -> new tag (e.g. v1.10) -> Publish release.
# The APKs appear on the release a few minutes later.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64    the signing key file, base64-encoded
#   KEYSTORE_PASSWORD  its password
name: Release APK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::The KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets are not set."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > paxwave-release.jks
          {
            echo "storeFile=paxwave-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=paxwave"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Build the release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleProdRelease --no-daemon \
            -x lintVitalProdRelease -x lintVitalAnalyzeProdRelease -x lintVitalReportProdRelease

      - name: Check the signature and name the files
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          VERSION="${{ github.event.release.tag_name || 'manual' }}"
          mkdir dist
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            apk="app/build/outputs/apk/prod/release/app-prod-$abi-release.apk"
            "$APKSIGNER" verify --print-certs "$apk" | grep -q "CN=PAXwave" || {
              echo "::error::$apk is not signed with the PAXwave key"; exit 1; }
            cp "$apk" "dist/PAXwave-$VERSION-$abi.apk"
          done
          rm -f paxwave-release.jks keystore.properties
          ls -la dist

      - name: Attach the APKs to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.apk --clobber

      - name: Keep the APKs as a download (manual runs)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: PAXwave-apks
          path: dist/*.apk
